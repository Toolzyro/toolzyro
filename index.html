<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toolzyro — The AI Toolbox</title>
<meta name="description" content="A daily-updated directory of free, freemium, and premium AI tools.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-mark">⚙</span>
      <span class="logo-text">TOOLZYRO</span>
    </div>
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="search the toolbox…" autocomplete="off" aria-label="Search tools">
    </div>
    <div class="tool-count"><span id="toolCount">0</span> tools</div>
  </div>
</header>

<section class="hero">
  <div class="pegboard-bg" aria-hidden="true"></div>
  <h1>TOOLZYRO</h1>
  <p class="tagline">The AI toolbox — restocked daily.</p>
</section>

<nav class="filter-bar" aria-label="Filter tools by pricing tier">
  <button class="filter-pill active" data-tier="all" type="button">All</button>
  <button class="filter-pill" data-tier="free" type="button"><span class="dot dot-free"></span>Free</button>
  <button class="filter-pill" data-tier="freemium" type="button"><span class="dot dot-freemium"></span>Freemium</button>
  <button class="filter-pill" data-tier="premium" type="button"><span class="dot dot-premium"></span>Premium</button>
</nav>

<main>
  <div id="grid" class="tool-grid"></div>
  <p id="emptyState" class="empty-state" hidden>Nothing on the shelf for "<span id="emptyQuery"></span>" yet. Try a different search.</p>
</main>

<footer class="site-footer">
  <p>Toolzyro · new tools added regularly · maintained by hand, one entry at a time</p>
</footer>

<script src="data/tools.js"></script>
<script src="script.js"></script>
</body>
</html>
